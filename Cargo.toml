[package]
name = "drm-beatsaver-cacher"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.9", features = ["macros"] }
beatsaver-api = { git = "https://github.com/mercurialworld/beatsaver-api", version = "0.3.3" }
chrono = { version = "0.4.42", features = ["serde"] }
config = "0.15.25"
env_logger = "0.11.8"
flate2 = "1.1.5"
futures = "0.3.33"
futures-util = "0.3.33"
log = "0.4.29"
prost = "0.14.1"
protobuf = "3.7.2"
rstest = "0.26.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_repr = "0.1.20"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["fs", "set-status", "trace"] }

[build-dependencies]
prost-build = "0.14.1"
